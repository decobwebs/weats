<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WEATS Nigeria Limited - Staff Profile</title>

    <!-- Tailwind CSS via CDN with forms plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#17cf17",
                        background: "#f6f8f6",
                        dark: "#112111",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>

    <style>
        .profile-image-container {
            aspect-ratio: 2 / 3;
            max-height: 200px;
        }
    </style>
</head>

<body class="bg-background text-[#111811] font-sans min-h-screen flex flex-col">
    <header class="flex justify-center py-4 sm:py-6 px-4">
        <img src="images/weats-logo.png" alt="WEATS Nigeria Limited Logo" class="h-12 sm:h-14 w-auto" />
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4 sm:p-6">
        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-10 w-10 sm:h-12 sm:w-12 border-b-2 border-primary mb-3"></div>
            <p class="text-gray-500 text-sm sm:text-base">Loading staff data...</p>
        </div>

        <!-- Profile Card -->
        <div id="profileCard"
            class="hidden w-full max-w-md bg-white border-2 border-dashed border-[#b0fc90] rounded-xl shadow-lg p-5 sm:p-6 text-center">
            <div class="flex flex-col items-center">
                <div id="profileImage"
                    class="profile-image-container w-full max-w-[128px] bg-cover bg-center border-4 border-[#b0fc90] rounded-lg mb-4">
                </div>

                <h2 id="staffName" class="text-xl sm:text-2xl font-bold mb-1 truncate w-full"></h2>
                <p id="staffRole" class="text-gray-500 mb-4 text-sm sm:text-base"></p>

                <div class="w-full border-t border-gray-200 my-4"></div>

                <div class="text-left space-y-2.5 w-full text-sm sm:text-base">
                    <div class="flex justify-between">
                        <p class="text-gray-500">Staff ID</p>
                        <p id="staffID" class="font-medium truncate"></p>
                    </div>
                    <div class="flex justify-between">
                        <p class="text-gray-500">Department</p>
                        <p id="staffDept" class="font-medium truncate"></p>
                    </div>
                    <div class="flex justify-between">
                        <p class="text-gray-500">Status</p>
                        <p id="staffStatus" class="font-medium px-2 py-0.5 bg-green-100 text-green-800 rounded-md"></p>
                    </div>
                    <div class="flex justify-between">
                        <p class="text-gray-500">Valid Until</p>
                        <p id="staffValidUntil" class="font-medium truncate"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Error Card -->
        <div id="errorCard"
            class="hidden w-full max-w-md bg-red-50 text-red-700 rounded-xl shadow p-5 sm:p-6 text-center">
            <h2 class="text-lg sm:text-xl font-bold mb-2">Invalid Staff ID</h2>
            <p>The QR code you scanned is not recognized.</p>
        </div>
    </main>

    <footer class="text-center py-6 text-gray-500 text-xs sm:text-sm">
        © WEATS Nigeria Limited | Your trusted partner in engineering solutions
    </footer>

    <script src="staff-data.js"></script>

    <script>
        // Format YYYY-MM-DD to "31 Dec 2026"
        function formatDate(isoDate) {
            if (!isoDate) return "—";
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return new Date(isoDate).toLocaleDateString('en-GB', options);
        }

        const getStaffIdFromUrl = () => {
            const hash = window.location.hash || "";
            if (hash) {
                const idFromHash = hash.replace(/^#\/?/, "").trim();
                if (idFromHash) return decodeURIComponent(idFromHash);
            }
            const path = (window.location.pathname || "").replace(/^\//, "").trim();
            return path || null;
        };

        const staffID = getStaffIdFromUrl();
        const profileCard = document.getElementById("profileCard");
        const errorCard = document.getElementById("errorCard");
        const loading = document.getElementById("loading");

        if (staffID && staffDatabase && staffDatabase[staffID]) {
            const staff = staffDatabase[staffID];

            const imgPath = staff.image || `images/${staffID}.jpg`;
            document.getElementById("profileImage").style.backgroundImage = `url('${imgPath}')`;

            document.getElementById("staffName").textContent = staff.name || "—";
            document.getElementById("staffRole").textContent = staff.role || "Staff Member";
            document.getElementById("staffID").textContent = staffID;
            document.getElementById("staffDept").textContent = staff.department || "Operations";
            document.getElementById("staffStatus").textContent = staff.status || "Active";
            document.getElementById("staffValidUntil").textContent = formatDate(staff.validUntil) || "31 Dec 2026";

            setTimeout(() => {
                loading.style.display = "none";
                profileCard.classList.remove("hidden");
            }, 800);
        } else {
            setTimeout(() => {
                loading.style.display = "none";
                errorCard.classList.remove("hidden");
            }, 800);
        }
    </script>
</body>

</html>
